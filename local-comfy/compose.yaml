name: videogenerator-local
services:
  comfy:
    image: videogenerator-comfy:0.38.0-torch2.13-cu130
    build:
      context: .
      args:
        COMFY_COMMIT: 6b747c0428c343e1417219641db93a4fb7cb69ae
    container_name: videogenerator-comfy
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - type: bind
        source: ./data/models
        target: /data/models
        read_only: true
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./data/user:/data/user
      - ./data/cache:/data/cache
    read_only: true
    tmpfs:
      - /tmp:rw,size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats',timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 4
